[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhandtrack"
version = "0.1.4"
description = "A clean, reusable wrapper around MediaPipe's Hand Landmarker task. Real-time 3D hand tracking for Python."
readme = "README.md"
# Upper-bounded because MediaPipe itself does: its wheels cover Python 3.11-3.12
# on Intel macOS (0.10.x line), and newer lines dropped Intel macOS entirely.
# Without the bound, pip on e.g. Python 3.14 dies with a cryptic
# "No matching distribution found for mediapipe" during dependency resolution.
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
keywords = ["mediapipe", "hand-tracking", "computer-vision", "gesture", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mediapipe>=0.10.14",
    # <2 matters: mediapipe 0.10.x is built against the numpy 1.x ABI, and
    # letting pip start on numpy 2.x causes a long resolver backtrack plus a
    # broken cv2 ("numpy._core.multiarray failed to import").
    "numpy>=1.26,<2",
    # NOTE: no direct opencv dependency — mediapipe already pulls in
    # opencv-contrib-python (which provides cv2). Installing opencv-python
    # alongside it makes two distributions write the same cv2/ files and is
    # a known source of exactly those import crashes.
]

[project.optional-dependencies]
# Extra deps needed by python/examples/*. Install with: pip install -e ".[examples]"
examples = [
    "pynput>=1.7.6",
    "pycaw>=2022.11.1; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.urls]
Repository = "https://github.com/Xznder1984/OpenHandTracker"
Documentation = "https://github.com/Xznder1984/OpenHandTracker/blob/main/python/README.md"
Issues = "https://github.com/Xznder1984/OpenHandTracker/issues"
Homepage = "https://github.com/Xznder1984/OpenHandTracker"

[tool.setuptools.packages.find]
where = ["."]
include = ["openhandtrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]
