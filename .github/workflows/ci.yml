name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install library (with dev deps)
        run: pip install -e "python/[dev]"
      - name: Lint (ruff)
        working-directory: python
        run: ruff check .
      - name: Tests (pytest)
        working-directory: python
        run: python -m pytest

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/examples/virtual-piano/package-lock.json
      - name: Build main demo
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build virtual piano example
        working-directory: web/examples/virtual-piano
        run: |
          npm ci
          npm run build
