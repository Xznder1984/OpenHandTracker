name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted publishing (OIDC): PyPI verifies this workflow's identity and
# grants a short-lived token — no stored secrets required. Requires a
# one-time "Add publisher" on PyPI for this exact repo + workflow name
# (see CONTRIBUTING.md → Releasing).
permissions:
  id-token: write

jobs:
  publish:
    name: Build + publish openhandtrack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
