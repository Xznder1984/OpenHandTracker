<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OpenHandTrack web demo — real-time 3D hand tracking in your browser."
    />
    <title>OpenHandTrack — webcam hand tracking</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230b1220'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%2322d3ee' stroke-width='6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header>
      <h1><span class="accent">OpenHandTrack</span> · webcam demo</h1>
      <p class="subtitle">Real-time 3D hand tracking, right in the browser</p>
    </header>

    <div class="camera-wrap">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="status">Loading…</div>
    </div>

    <div class="legend">
      <span class="left">Left hand</span>
      <span class="right">Right hand</span>
    </div>

    <footer>
      Built on <code>@mediapipe/tasks-vision</code> via the OpenHandTrack wrapper.
      The model runs fully in your browser — nothing is uploaded anywhere.
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
